dab2c:
  integration-service:
    session:
      da-cookie:
        session-ttl-seconds: 3
        path: "/testpath"
        domain: "test-domain"

executor:
  voice:
    agentName: test-agent
    channel: test-channel

grpc:
  server:
    port: 29090
  client:
    downstream:
      address: static://localhost:29091
      negotiation-type: plaintext

# WireMock injects ports dynamically via baseUrlProperties
giga:
  voice:
    agent:
      client:
        baseUrl: ${wiremock.server.gigaVoiceAgent.baseUrl:http://localhost:8080}
        connectionTimeout: 5000
        requestTimeout: 5000

efs:
  adapter:
    baseUrl: ${wiremock.server.efsAdapter.baseUrl:http://localhost:8081}
    connectionTimeout: 5000
    requestTimeout: 5000

logging:
  level:
    root: DEBUG
    ru.sbrf.ufs.dab2c.core.voice: DEBUG
    net.devh.boot.grpc: DEBUG

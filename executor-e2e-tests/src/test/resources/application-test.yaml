executor:
  voice:
    agentName: test-agent
    channel: test-channel
  additional-mdc-keys:
    deploymentUnit: executor
    block: none
  masking:
    key-masking-enabled: true
    regex-masking-enabled: true
    regex-patterns:
      - '(?<="first_name":")[^"]*'
      - '(?<="patr_name":")[^"]*'
      - '(?<="firstName":")[^"]*'
      - '(?<="patrName":")[^"]*'
      - '(?<=\\"first_name\\":\\")[^\\"]*'
      - '(?<=\\"patr_name\\":\\")[^\\"]*'
      - '(?<=\\"firstName\\":\\")[^\\"]*'
      - '(?<=\\"patrName\\":\\")[^\\"]*'

grpc:
  server:
    port: 29090
  client:
    downstream:
      address: static://localhost:29091

# KAP Producer configuration
kafka:
  kap:
    producer:
      enabled: true
      bootstrapServers: ${spring.embedded.kafka.brokers}
      dialogsTopic: dab2c-core-dialogs
      agentsTopic: dab2c-agents
      clientId: test-kap-producer
      acks: all
      retries: 1

aef:
  tracing:
    mode: KAFKA
    voice-enabled: true
    grpc-enabled: false
    websocket-enabled: false
    topic: aef-tracing-test
    session-id-headers:
      - x-session-id
      - x-session
    kafka:
      bootstrap-servers: ${spring.embedded.kafka.brokers}
  agent:
    agentId: prototype-agent
    distributive: prototype-distributive
    clusterId: prototype-cluster-id
    namespace: prototype-namespace

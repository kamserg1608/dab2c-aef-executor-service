  wait_qg: "2"

### Сборка BH, конфигураций и DB — см. build_distribution.groovy ###
jenkinsfiles:
  - {
    # id приложения. используется при сборке как названия папки, куда клонируется репозиторий.
    name: "core-java-distr-1.0",
    # путь к репозиторию в BitBucket, где лежат исходники ФП
    repo: "digital_assisitant_b2c/dab2c-aef-executor-service.git",
    # ветка, которую нужно собирать. Делаем всегда подстановку текущей ветки (по которой ведётся сборка).
    # стоит помнить, что эта фича активируется благодаря тому, что в пайплайновой джобе мы добавили параметр PARAMETERIZATION_YML и установили его в true.
    branch: "${CONFIG_BRANCH}",
    # Путь к файлу для сборки
    jenkinsfile_name: "jenkins/build_distribution.groovy",
    # ветка, в которой лежит последний опубликованный релиз, или начальная ветка
    prod_branch: "release/1.12.1"
  }

downloads:
  - {
    source: "git",
    type: "conf",
    repo: "dot_ci/version.conf.git",
    branch: "release/fh",
    prod_branch: "master",
    files: "version.conf"
  }

docker:

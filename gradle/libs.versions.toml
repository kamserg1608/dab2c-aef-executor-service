[versions]
kotlin = "2.1.20"
detekt = "1.23.7"
spotbugs-plugin = "6.2.0"
spotbugs-tool = "4.9.3"
spring-boot = "3.5.4"
springdoc-openapi = "2.8.0"
openapi-generator = "7.10.0"
micrometer = "1.13.4"

# Kotlinx (not managed by Spring Boot)
kotlinx-coroutines = "1.10.1"

# Logging (not managed by Spring Boot)
kotlin-logging = "7.0.4"
logstash-logback-encoder = "8.0"

# Testing (not managed by Spring Boot)
mockk = "1.14.7"
wiremock = "3.10.0"

# gRPC and Protobuf (not managed by Spring Boot)
grpc = "1.74.0"
grpc-kotlin = "1.4.3"
grpc-spring-boot-starter = "3.1.0.RELEASE"
protobuf = "4.29.3"
protobuf-plugin = "0.9.4"

# Ktor (not managed by Spring Boot)
ktor = "3.1.2"

# Konvert (mapping library)
konvert = "4.1.0"
ksp = "2.1.20-1.0.32"

aef-sdk = "1.1.83-SNAPSHOT"
opentelemetry = "1.42.1"
opentelemetry-proto = "1.3.2-alpha"

[libraries]
# Spring Boot BOM
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# Spring Boot starters (versions managed by BOM)
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }

# 🔹 Springdoc OpenAPI (не управляется Spring Boot BOM)
springdoc-openapi-starter-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc-openapi" }

# Spring Kafka (versions managed by BOM)
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }

# JUnit (version managed by Spring Boot BOM)
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-slf4j = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

# Micrometer Context Propagation
micrometer-context-propagation = { module = "io.micrometer:context-propagation", version = "micrometer" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

# Ktor Client
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-jackson = { module = "io.ktor:ktor-serialization-jackson", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

# Logging
kotlin-logging-jvm = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }

# Gradle plugins (for buildSrc)
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
spotbugs-gradle-plugin = { module = "com.github.spotbugs:com.github.spotbugs.gradle.plugin", version.ref = "spotbugs-plugin" }
spotbugs = { module = "com.github.spotbugs:spotbugs", version.ref = "spotbugs-tool" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs-tool" }
protobuf-gradle-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobuf-plugin" }
openapi-generator-gradle-plugin = { module = "org.openapitools:openapi-generator-gradle-plugin", version.ref = "openapi-generator" }

# Testing (mockk not in Spring Boot BOM)
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
wiremock-spring-boot = { module = "org.wiremock.integrations:wiremock-spring-boot", version.ref = "wiremock" }

# gRPC and Protobuf
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }
grpc-server-spring-boot-starter = { module = "net.devh:grpc-server-spring-boot-starter", version.ref = "grpc-spring-boot-starter" }
grpc-client-spring-boot-starter = { module = "net.devh:grpc-client-spring-boot-starter", version.ref = "grpc-spring-boot-starter" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }

# Jackson (version managed by Spring Boot BOM)
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }

# Konvert (mapping library)
konvert-api = { module = "io.mcarle:konvert-api", version.ref = "konvert" }
konvert = { module = "io.mcarle:konvert", version.ref = "konvert" }

# AEF SDK
aef-sdk-core = { module = "ru.sbrf.aef:sdk-core", version.ref = "aef-sdk" }
aef-sdk-voice = { module = "ru.sbrf.aef:sdk-voice", version.ref = "aef-sdk" }
aef-sdk-spring-boot-starter = { module = "ru.sbrf.aef:sdk-spring-boot-starter", version.ref = "aef-sdk" }

# OpenTelemetry (aligned with AEF SDK transitive version)
opentelemetry-extension-kotlin = { module = "io.opentelemetry:opentelemetry-extension-kotlin", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry" }
opentelemetry-proto = { module = "io.opentelemetry.proto:opentelemetry-proto", version.ref = "opentelemetry-proto" }

# KSP (for buildSrc)
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }

[bundles]
# Kotlinx
kotlinx = [
    "kotlinx-coroutines-core"
]

# Ktor client
ktor-client = [
    "ktor-client-core",
    "ktor-client-cio",
    "ktor-client-content-negotiation",
    "ktor-client-logging",
    "ktor-serialization-jackson"
]

# gRPC
grpc = [
    "grpc-netty-shaded",
    "grpc-protobuf",
    "grpc-stub",
    "grpc-kotlin-stub",
    "protobuf-java",
    "protobuf-kotlin",
    "protobuf-java-util"
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

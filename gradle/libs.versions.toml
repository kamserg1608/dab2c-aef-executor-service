[versions]
kotlin = "2.1.0"

#BOMs
ufs-platform-bom = "10.4.2.50"

# Spring Boot and related
spring-boot = "2.7.18"

# Kotlinx
kotlinx-coroutines = "1.9.0"
kotlinx-datetime = "0.6.1"

# Logging
kotlin-logging = "5.1.0"

# Other libraries
javax-annotation-api = "1.3.2"

# Testing
mockk = "1.14.5"

resilience4j = "1.7.0"
assertj = "3.24.2"

#ACL
acl = "1.0.8"

[libraries]
#platform BOM
ufs-platform-bom = { module = "ru.sbrf.ufs.platform:ufs-platform-bom", version.ref = "ufs-platform-bom" }

# Spring Boot
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-aop = { module = "org.springframework.boot:spring-boot-starter-aop" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

# Jackson
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }

# Kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# resilience4j
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j"}

# Logging
kotlin-logging-jvm = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
logback-classic = { module = "ch.qos.logback:logback-classic" }
logback-core = { module = "ch.qos.logback:logback-core" }

# Validation
javax-annotation-api = { module = "javax.annotation:javax.annotation-api", version.ref = "javax-annotation-api" }

# Gradle plugins (for buildSrc)
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }

ufs-platform-api = { module = "ru.sbrf.ufs.platform:ufs-platform-api" }
ufs-platform-json-mapper = { module = "ru.sbrf.ufs.platform:ufs-platform-json-mapper" }

# Testing
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# JUnit Platform
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-platform-engine = { module = "org.junit.platform:junit-platform-engine" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }

#Monitoring
monitoring-starter = { module = "ru.sbrf.ufs.monitoring.spring-boot:monitoring-spring-boot-starter" }
monitoring-api = { module = "ru.sbrf.ufs.platform:ufs-platform-monitoring-api" }
monitoring-core = { module = "ru.sbrf.ufs.monitoring:monitoring-core" }
monitoring-models = { module = "ru.sbrf.ufs.monitoring:monitoring-models" }
monitoring-module = { module = "ru.sbrf.ufs.monitoring:monitoring-module" }
monitoring-session = { module = "ru.sbrf.ufs.monitoring:monitoring-session" }
monitoring-spring-boot-autoconfigure = { module = "ru.sbrf.ufs.monitoring.spring-boot:monitoring-spring-boot-autoconfigure" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }

#Logging
ufs-logger-springboot-starter = { module = "ru.sbrf.ufs.platform:logger-springboot-starter" }
ufs-logger-api = { module = "ru.sbrf.ufs.platform:logger-api" }

#Healthcheck
ufs-platform-healthcheck-api = { module = "ru.sbrf.ufs.platform:ufs-platform-healthcheck-api" }
ufs-healthcheck-spring-boot-starter = { module = "ru.sbrf.ufs.healthcheck:ufs-healthcheck-spring-boot-starter" }

#СУП
ufs-platform-config-api = { module = "ru.sbrf.ufs.platform:ufs-platform-config-api" }
config-agent-api = { module = "ru.sbrf.ufs.platform:config-agent-api" }
ufs-platform-config-spring-boot-starter = { module = "ru.sbrf.ufs.platform:ufs-platform-config-spring-boot-starter" }
config-agent-spring-boot-starter = { module = "ru.sbrf.ufs.platform:config-agent-spring-boot-starter" }

#Sber-acl
sber-acl = { module = "ru.sbrf.ufs.dab2c.acl:sber-acl-java", version.ref = "acl" }

[bundles]
# Spring Boot Web and Core

ufs-core = [
    "ufs-platform-api",
    "ufs-platform-json-mapper"
]

ufs-logging = [
    "ufs-logger-springboot-starter",
    "ufs-logger-api",
    "kotlin-logging-jvm",
    "logback-classic",
    "logback-core"
]

ufs-monitoring = [
    "monitoring-starter",
    "monitoring-api",
    "monitoring-core",
    "monitoring-models",
    "monitoring-module",
    "monitoring-session",
    "monitoring-spring-boot-autoconfigure",
    "monitoring-spring-boot-autoconfigure",
    "spring-boot-starter-actuator"
]

ufs-healthcheck = [
    "ufs-platform-healthcheck-api",
    "ufs-healthcheck-spring-boot-starter"
]

ufs-sup = [
    "ufs-platform-config-api",
    "ufs-platform-config-api",
    "config-agent-api",
    "ufs-platform-config-spring-boot-starter",
    "config-agent-spring-boot-starter"
]

spring-boot-web = [
    "spring-boot-starter-webflux",
    "spring-boot-starter-aop"
]

# Jackson
jackson = [
    "jackson-module-kotlin",
    "jackson-annotations",
    "jackson-datatype-jsr310",
    "jackson-databind"
]

# Kotlinx
kotlinx = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-reactor",
    "kotlinx-datetime"
]

# Testing
testing = [
    "spring-boot-starter-test",
    "junit-jupiter-api",
    "junit-jupiter-engine",
    "junit-jupiter-params",
    "junit-platform-launcher",
    "junit-platform-engine",
    "assertj-core",
    "mockk",
]

[plugins]
# Kotlin plugins
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Spring Boot plugins
spring-boot = { id = "org.springframework.boot" }

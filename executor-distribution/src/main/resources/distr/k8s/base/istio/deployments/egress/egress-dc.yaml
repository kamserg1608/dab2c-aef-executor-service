kind: Deployment
apiVersion: apps/v1
metadata:
  name: egressgateway-@fpi-name@-unver
  labels:
    app: istio-egressgateway-@fpi-name@-unver
    istio: egressgateway-@fpi-name@-unver
    maistra.io/owner: ${@fpi-name@.ctr.istio.control-plane-project}
    release: istio
    secman-injector: enabled
    app.kubernetes.io/component: gateways
    app.kubernetes.io/instance: ${@fpi-name@.ctr.istio.control-plane-project}
    app.kubernetes.io/name: gateways
    app.kubernetes.io/part-of: istio
spec:
  serviceAccount: default
  progressDeadlineSeconds: 600
  replicas: ${@fpi-name@.ctr.istio.egress.deployment.spec.replicas}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: istio-egressgateway-@fpi-name@-unver
      istio: egressgateway-@fpi-name@-unver
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: ${@fpi-name@.ctr.istio.egress.deployment.spec.strategy.rollingUpdate.maxUnavailable}
      maxSurge: ${@fpi-name@.ctr.istio.egress.deployment.spec.strategy.rollingUpdate.maxSurge}
  template:
    metadata:
      annotations:
        proxy.istio.io/config: |
          discoveryAddress: istiod-synapse-control-panel.synapse-control-panel.svc:15012
        sidecar.istio.io/inject: "false"

        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-set-security-context: "true"
        vault.hashicorp.com/agent-json-patch: '[{"op": "replace", "path": "/securityContext/privileged", "value":false}, {"op": "replace", "path": "/securityContext/runAsUser", "value": 1003600337}]'
        vault.hashicorp.com/agent-init-json-patch: '[{"op": "replace", "path": "/securityContext/privileged", "value":false}, {"op": "replace", "path": "/securityContext/runAsUser", "value": 1003600337}]'
        vault.hashicorp.com/agent-volumes-default-mode: '0400'
        vault.hashicorp.com/agent-inject-default-template: "json"
        vault.hashicorp.com/agent-pre-populate: "true"
        vault.hashicorp.com/agent-limits-cpu: 200m
        vault.hashicorp.com/agent-requests-cpu: 150m
        vault.hashicorp.com/role: "${global.multiClusters.openshiftProjectName}"
        vault.hashicorp.com/namespace: "{{ lookup('custom_vars', 'global.hashicorp.opsPathCommonPKI').split('/')[1] }}"
        vault.hashicorp.com/tls-skip-verify: "false"

        "vault.hashicorp.com/agent-inject-secret-client-cert.pem": "true"
        "vault.hashicorp.com/secret-volume-path-client-cert.pem": /vault/secrets
        "vault.hashicorp.com/agent-inject-template-client-cert.pem":  >-
          {% raw -%} {{- with secret {%- endraw %} "{{ SBERCA_CLIENT_PATH | default(lookup('custom_vars', 'global.hashicorp.opsPathCommonPKI') + '/fetch/' + lookup('custom_vars', 'global.hashicorp.clientSberCARole')) }}" "common_name={{ SBERCA_CLIENT_CN | default(fpConfig.groupId + '-' + fpConfig.artifactId + '-CLIENT') }}" "format=pem" "exclude_cn_from_sans=true" }}
          {%- raw -%} {{ ( index .Data "certificate" ) }} {%- endraw -%}
          {%- raw -%} {{- end -}} {%- endraw %}

        "vault.hashicorp.com/agent-inject-secret-client-cert.key": "true"
        "vault.hashicorp.com/secret-volume-path-client-cert.key": /vault/secrets
        "vault.hashicorp.com/agent-inject-template-client-cert.key":  >-
          {% raw -%} {{- with secret {%- endraw %} "{{ SBERCA_CLIENT_PATH | default(lookup('custom_vars', 'global.hashicorp.opsPathCommonPKI') + '/fetch/' + lookup('custom_vars', 'global.hashicorp.clientSberCARole')) }}" "common_name={{ SBERCA_CLIENT_CN | default(fpConfig.groupId + '-' + fpConfig.artifactId + '-CLIENT') }}" "format=pem" "exclude_cn_from_sans=true" }}
          {%- raw -%} {{ ( index .Data "private_key" ) }} {%- endraw -%}
          {%- raw -%} {{- end -}} {%- endraw %}

        "vault.hashicorp.com/agent-inject-secret-ca-chain.pem": "true"
        "vault.hashicorp.com/secret-volume-path-ca-chain.pem": /vault/secrets
        "vault.hashicorp.com/agent-inject-template-ca-chain.pem":  >-
          {% raw -%} {{- with secret {%- endraw %} "{{ SBERCA_CLIENT_PATH | default(lookup('custom_vars', 'global.hashicorp.opsPathCommonPKI') + '/fetch/' + lookup('custom_vars', 'global.hashicorp.clientSberCARole')) }}" "common_name={{ SBERCA_CLIENT_CN | default(fpConfig.groupId + '-' + fpConfig.artifactId + '-CLIENT') }}" "format=pem" "exclude_cn_from_sans=true" }}
          {%- raw -%} {{ ( index .Data "ca_chain" 0 ) }} {%- endraw -%}
          {%- raw -%} {{ ( index .Data "ca_chain" 1 ) }} {%- endraw -%}
          {%- raw -%} {{- end -}} {%- endraw %}
      labels:
        app: istio-egressgateway-@fpi-name@-unver
        chart: gateways
        heritage: Tiller
        istio: egressgateway-@fpi-name@-unver
        release: istio
        secman-injector: enabled
    spec:
      serviceAccount: default
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - istio-egressgateway-@fpi-name@-unver
                topologyKey: 'kubernetes.io/hostname'
      securityContext:
        runAsNonRoot: true
        runAsUser: 1003600337
        runAsGroup: 1003600337
        fsGroup: 10337
        seccompProfile:
          type: RuntimeDefault
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: ${global.ufs.secrets.imagePullSecrets}
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: ${@fpi-name@.ctr.istio.egress.deployment.spec.template.spec.terminationGracePeriodSeconds}
      volumes:
        - name: config-volume
          configMap:
            name: istio-basic-unver
            defaultMode: 256
            optional: true
#        - name: egressgateway-certs
#          secret:
#            secretName: client-certs-sberca.unver
#            defaultMode: 256
#        - name: egressgateway-ca-certs
#          secret:
#            secretName: trust-ca-certs-kv.unver
#            defaultMode: 256
        - name: istio-data
          emptyDir: {}
        - name: istio-envoy
          emptyDir: {}
        - name: istio-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: istio-ca
                  expirationSeconds: 3600
                  path: istio-token
            defaultMode: 256
        - name: istiod-ca-cert
          configMap:
            name: istio-ca-root-cert
            defaultMode: 256
        - name: logsshare
          emptyDir: {}
        - name: podinfo
          downwardAPI:
            items:
              - path: labels
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels
              - path: annotations
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.annotations
            defaultMode: 256
        - name: workload-socket
          emptyDir: {}
      containers:
        - name: istio-proxy
          image: ${registry}/ci05041325/ci05041325/polm/proxyv2:5.4.3-410@sha256:43e13385fabdd3123c978753b4fa7e61fd92a828551591a8eb6198da4c6aa671
          imagePullPolicy: IfNotPresent
          args:
            - proxy
            - router
            - '--proxyLogFormat={"level":"%l","time":"%Y-%m-%dT%T.%fZ","scope":"envoy%n","msg":"%j"}'
            - '--log_target=stdout'
            - '--domain'
            - $(POD_NAMESPACE).svc.cluster.local
            - '--serviceCluster'
            - istio-egressgateway-@fpi-name@-unver
            - '--drain-strategy=immediate'
          env:
            - name: CA_ADDR
              value: >-
                ${@fpi-name@.ctr.istio.control-plane-istiod-service}.${@fpi-name@.ctr.istio.control-plane-project}.svc:15012
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.hostIP
            - name: INSTANCE_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
            - name: ISTIO_META_CLUSTER_ID
              value: Kubernetes
            - name: ISTIO_META_MESH_ID
              value: cluster.local
            - name: ISTIO_META_OWNER
              value: >-
                kubernetes://apis/apps/v1/namespaces/${@fpi-name@.ctr.istio.control-plane-project}/deployments/egressgateway-@fpi-name@-unver
            - name: ISTIO_META_UNPRIVILEGED_POD
              value: 'true'
            - name: ISTIO_META_WORKLOAD_NAME
              value: egressgateway-@fpi-name@-unver
            - name: JWT_POLICY
              value: third-party-jwt
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: PILOT_CERT_PROVIDER
              value: istiod
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.serviceAccountName
            - name: TRUST_DOMAIN
              value: cluster.local
          securityContext:
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 1003600337
            runAsGroup: 1003600337
            fsGroup: 10337
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: status-port
              containerPort: 15021
              protocol: TCP
            - name: http
              containerPort: ${@fpi-name@.ctr.istio.egress.common.internal-port}
              protocol: TCP
            - name: http-monitoring
              containerPort: ${global.monitoring.store.port}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 15021
              scheme: HTTP
            initialDelaySeconds: 3
            timeoutSeconds: 1
            periodSeconds: 2
            successThreshold: 1
            failureThreshold: 30
          resources:
            limits:
              cpu: ${@fpi-name@.ctr.istio.egress.deployment.spec.template.spec.containers.resources.limits.cpu}
              memory: ${@fpi-name@.ctr.istio.egress.deployment.spec.template.spec.containers.resources.limits.memory}
            requests:
              cpu: ${@fpi-name@.ctr.istio.egress.deployment.spec.template.spec.containers.resources.requests.cpu}
              memory: ${@fpi-name@.ctr.istio.egress.deployment.spec.template.spec.containers.resources.requests.memory}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: config-volume
              mountPath: /var/istio/config
            - name: istio-data
              mountPath: /var/lib/istio/data
            - name: istio-envoy
              mountPath: /etc/istio/proxy
            - name: istio-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: istiod-ca-cert
              mountPath: /var/run/secrets/istio
              readOnly: true
            - name: podinfo
              mountPath: /etc/istio/pod
              readOnly: true
            - name: workload-socket
              mountPath: /var/run/secrets/workload-spiffe-uds

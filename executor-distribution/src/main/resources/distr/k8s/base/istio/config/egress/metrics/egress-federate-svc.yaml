apiVersion: v1
kind: Service
metadata:
  name: egressgateway-federate-@fpi-name@-unver
  labels:
    app: egressgateway-@fpi-name@-unver
  namespace: ${global.multiClusters.openshiftProjectName}
spec:
  ports:
    - name: http-2001
      protocol: TCP
      port: 2001
      targetPort: 2001
  selector:
    app: istio-egressgateway-@fpi-name@-unver

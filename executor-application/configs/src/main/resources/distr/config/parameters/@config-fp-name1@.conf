# Параметры для application-PROM.yaml, блок server.tomcat
## минимальное количество потоков в пуле для обработки http запросов, например 10
@config-fp-name1@.server.tomcat.min-spare-threads=10
## максимальное количество потоков в пуле для обработки, например 200
@config-fp-name1@.server.tomcat.max-threads=200

# Параметры для openshift/<config-fp-name>/dc.yaml

## Количество реплик. Обязано быть не меньше 2
@config-fp-name1@.ose.deployment.spec.replicas=14

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.metadata.annotations (сайдкар Istio Proxy)
@config-fp-name1@.ose.deployment.metadata.annotations.sidecar.istio.io.proxyCPU=750m
@config-fp-name1@.ose.deployment.metadata.annotations.sidecar.istio.io.proxyMemory=200Mi
@config-fp-name1@.ose.deployment.metadata.annotations.sidecar.istio.io.proxyCPULimit=750m
@config-fp-name1@.ose.deployment.metadata.annotations.sidecar.istio.io.proxyMemoryLimit=300Mi

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.spec
@config-fp-name1@.ose.deployment.spec.template.spec.terminationGracePeriodSeconds=60

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.spec.containers[maincontainer].livenessProbe
@config-fp-name1@.ose.deployment.spec.template.spec.containers.@config-fp-name1@.livenessProbe.failureThreshold=3
@config-fp-name1@.ose.deployment.spec.template.spec.containers.@config-fp-name1@.livenessProbe.initialDelaySeconds=90
@config-fp-name1@.ose.deployment.spec.template.spec.containers.@config-fp-name1@.livenessProbe.periodSeconds=10
@config-fp-name1@.ose.deployment.spec.template.spec.containers.@config-fp-name1@.livenessProbe.timeoutSeconds=3
@config-fp-name1@.ose.deployment.spec.template.spec.containers.@config-fp-name1@.livenessProbe.successThreshold=1

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.spec.containers[maincontainer].readinessProbe
@config-fp-name1@.ose.deployment.spec.template.spec.containers.@config-fp-name1@.readinessProbe.failureThreshold=${global.ufs.common.readiness.failureThreshold}
@config-fp-name1@.ose.deployment.spec.template.spec.containers.@config-fp-name1@.readinessProbe.initialDelaySeconds=45
@config-fp-name1@.ose.deployment.spec.template.spec.containers.@config-fp-name1@.readinessProbe.periodSeconds=${global.ufs.common.readiness.periodSeconds}
@config-fp-name1@.ose.deployment.spec.template.spec.containers.@config-fp-name1@.readinessProbe.timeoutSeconds=${global.ufs.common.readiness.timeoutSeconds}
@config-fp-name1@.ose.deployment.spec.template.spec.containers.@config-fp-name1@.readinessProbe.successThreshold=${global.ufs.common.readiness.successThreshold}

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.spec.containers[maincontainer].resources
@config-fp-name1@.ose.deployment.spec.template.spec.containers.@config-fp-name1@.resources.requests.cpu=1500m
@config-fp-name1@.ose.deployment.spec.template.spec.containers.@config-fp-name1@.resources.requests.memory=2000Mi
@config-fp-name1@.ose.deployment.spec.template.spec.containers.@config-fp-name1@.resources.limits.cpu=1500m
@config-fp-name1@.ose.deployment.spec.template.spec.containers.@config-fp-name1@.resources.limits.memory=2000Mi

# Параметры для openshift/<config-fp-name>/dc.yaml
## Параметры для  openshift/<config-fp-name>/dc.yaml, блок spec.resources и spec.strategy.rollingParams
### Максимальное число подов, которые могут быть запланированы выше исходного количества подов (можно в процентах, можно явное количество)
@config-fp-name1@.ose.deployment.spec.strategy.rollingParams.maxSurge=${global.ufs.strategy.maxSurge}
### Максимальное количество подов, которые могут быть недоступны во время обновления (можно в процентах, можно явное количество)
@config-fp-name1@.ose.deployment.spec.strategy.rollingParams.maxUnavailable=${global.ufs.strategy.maxUnavailable}

### НЕНУЖНОЕ, выпилить как починят валидатор:
### Время ожидания между опросом состояния деплоймента после обновления
@config-fp-name1@.ose.deployment.spec.strategy.rollingParams.intervalSeconds=${global.ufs.strategy.intervalSeconds}
### Время ожидания поднятия подов, прежде чем сдаться и откатится к предыдущему успешному деплойменту
@config-fp-name1@.ose.deployment.spec.strategy.rollingParams.timeoutSeconds=${global.ufs.strategy.timeoutSeconds}
### Время ожидания между отдельными обновлениями пода
@config-fp-name1@.ose.deployment.spec.strategy.rollingParams.updatePeriodSeconds=${global.ufs.strategy.updatePeriodSeconds}


# Настройки jvm для старта
# Настройки возможно будут еще уточняться.
# -XX:+AlwaysActAsServerClassMachine - enable G1 GC regardless of cpu limit on container
# -XX:+PerfDisableSharedMem - disable write to tmp/hsperfdata_user/pid, decrease safe point time
# -XX:+AlwaysPreTouch - commit all memory on start
@config-fp-name1@.ose.configmap.javaArguments=-XX:+AlwaysActAsServerClassMachine -XX:MinRAMPercentage=50.0 -XX:MaxRAMPercentage=50.0 -XX:+PerfDisableSharedMem -XX:+AlwaysPreTouch -Djava.security.egd=file:/dev/./urandom

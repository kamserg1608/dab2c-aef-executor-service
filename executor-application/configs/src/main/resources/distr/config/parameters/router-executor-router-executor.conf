# Параметры для application-PROM.yaml, блок server.tomcat
## минимальное количество потоков в пуле для обработки http запросов, например 10
router-executor-router-executor.server.tomcat.min-spare-threads=10
## максимальное количество потоков в пуле для обработки, например 200
router-executor-router-executor.server.tomcat.max-threads=200

# Параметры для openshift/<config-fp-name>/dc.yaml

## Количество реплик. Обязано быть не меньше 2
router-executor-router-executor.ose.deployment.spec.replicas=14

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.metadata.annotations (сайдкар Istio Proxy)
router-executor-router-executor.ose.deployment.metadata.annotations.sidecar.istio.io.proxyCPU=750m
router-executor-router-executor.ose.deployment.metadata.annotations.sidecar.istio.io.proxyMemory=200Mi
router-executor-router-executor.ose.deployment.metadata.annotations.sidecar.istio.io.proxyCPULimit=750m
router-executor-router-executor.ose.deployment.metadata.annotations.sidecar.istio.io.proxyMemoryLimit=300Mi

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.spec
router-executor-router-executor.ose.deployment.spec.template.spec.terminationGracePeriodSeconds=60

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.spec.containers[maincontainer].livenessProbe
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.livenessProbe.failureThreshold=3
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.livenessProbe.initialDelaySeconds=90
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.livenessProbe.periodSeconds=10
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.livenessProbe.timeoutSeconds=3
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.livenessProbe.successThreshold=1

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.spec.containers[maincontainer].readinessProbe
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.readinessProbe.failureThreshold=${global.ufs.common.readiness.failureThreshold}
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.readinessProbe.initialDelaySeconds=45
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.readinessProbe.periodSeconds=${global.ufs.common.readiness.periodSeconds}
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.readinessProbe.timeoutSeconds=${global.ufs.common.readiness.timeoutSeconds}
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.readinessProbe.successThreshold=${global.ufs.common.readiness.successThreshold}

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.spec.containers[maincontainer].resources
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.resources.requests.cpu=1500m
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.resources.requests.memory=2000Mi
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.resources.limits.cpu=1500m
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.resources.limits.memory=2000Mi

# Параметры для openshift/<config-fp-name>/dc.yaml
## Параметры для  openshift/<config-fp-name>/dc.yaml, блок spec.resources и spec.strategy.rollingParams
### Максимальное число подов, которые могут быть запланированы выше исходного количества подов (можно в процентах, можно явное количество)
router-executor-router-executor.ose.deployment.spec.strategy.rollingParams.maxSurge=${global.ufs.strategy.maxSurge}
### Максимальное количество подов, которые могут быть недоступны во время обновления (можно в процентах, можно явное количество)
router-executor-router-executor.ose.deployment.spec.strategy.rollingParams.maxUnavailable=${global.ufs.strategy.maxUnavailable}

### НЕНУЖНОЕ, выпилить как починят валидатор:
### Время ожидания между опросом состояния деплоймента после обновления
router-executor-router-executor.ose.deployment.spec.strategy.rollingParams.intervalSeconds=${global.ufs.strategy.intervalSeconds}
### Время ожидания поднятия подов, прежде чем сдаться и откатится к предыдущему успешному деплойменту
router-executor-router-executor.ose.deployment.spec.strategy.rollingParams.timeoutSeconds=${global.ufs.strategy.timeoutSeconds}
### Время ожидания между отдельными обновлениями пода
router-executor-router-executor.ose.deployment.spec.strategy.rollingParams.updatePeriodSeconds=${global.ufs.strategy.updatePeriodSeconds}


# Настройки jvm для старта
# Настройки возможно будут еще уточняться.
# -XX:+AlwaysActAsServerClassMachine - enable G1 GC regardless of cpu limit on container
# -XX:+PerfDisableSharedMem - disable write to tmp/hsperfdata_user/pid, decrease safe point time
# -XX:+AlwaysPreTouch - commit all memory on start
router-executor-router-executor.ose.configmap.javaArguments=-XX:+AlwaysActAsServerClassMachine -XX:MinRAMPercentage=50.0 -XX:MaxRAMPercentage=50.0 -XX:+PerfDisableSharedMem -XX:+AlwaysPreTouch -Djava.security.egd=file:/dev/./urandom

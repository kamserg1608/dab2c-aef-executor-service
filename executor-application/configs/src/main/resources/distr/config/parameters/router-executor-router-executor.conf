# Параметры для application-PROM.yaml, блок server.tomcat
## минимальное количество потоков в пуле для обработки http запросов, например 10
router-executor-router-executor.server.tomcat.min-spare-threads=10
## максимальное количество потоков в пуле для обработки, например 200
router-executor-router-executor.server.tomcat.max-threads=200

# Параметры для openshift/<config-fp-name>/dc.yaml

# будет добавлено в под как JAVA_OPTS
router-executor-router-executor.ose.configmap.javaArguments=""

## Количество реплик. Обязано быть не меньше 2
router-executor-router-executor.ose.deployment.spec.replicas=2

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.metadata.annotations (сайдкар Istio Proxy)
router-executor-router-executor.ose.deployment.metadata.annotations.sidecar.istio.io.proxyCPU=!100m
router-executor-router-executor.ose.deployment.metadata.annotations.sidecar.istio.io.proxyMemory=!200Mi
router-executor-router-executor.ose.deployment.metadata.annotations.sidecar.istio.io.proxyCPULimit=!100m
router-executor-router-executor.ose.deployment.metadata.annotations.sidecar.istio.io.proxyMemoryLimit=!300Mi

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.spec
router-executor-router-executor.ose.deployment.spec.template.spec.terminationGracePeriodSeconds=60

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.spec.containers[maincontainer].livenessProbe
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.livenessProbe.failureThreshold=3
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.livenessProbe.initialDelaySeconds=180
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.livenessProbe.periodSeconds=1
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.livenessProbe.timeoutSeconds=10
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.livenessProbe.successThreshold=1

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.spec.containers[maincontainer].readinessProbe
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.readinessProbe.failureThreshold=3
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.readinessProbe.initialDelaySeconds=20
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.readinessProbe.periodSeconds=1
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.readinessProbe.timeoutSeconds=10
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.readinessProbe.successThreshold=1

## Параметры для openshift/<config-fp-name>/dc.yaml, блок spec.template.spec.containers[maincontainer].resources
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.resources.requests.cpu=!500m
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.resources.requests.memory=!500Mi
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.resources.limits.cpu=!1000m
router-executor-router-executor.ose.deployment.spec.template.spec.containers.router-executor-router-executor.resources.limits.memory=!1000Mi

# Параметры для openshift/<config-fp-name>/dc.yaml
## Параметры для  openshift/<config-fp-name>/dc.yaml, блок spec.resources и spec.strategy.rollingParams
### Время ожидания между опросом состояния деплоймента после обновления
router-executor-router-executor.ose.deployment.spec.strategy.rollingParams.intervalSeconds=${global.ufs.strategy.intervalSeconds}
### Максимальное число подов, которые могут быть запланированы выше исходного количества подов (можно в процентах, можно явное количество)
router-executor-router-executor.ose.deployment.spec.strategy.rollingParams.maxSurge=${global.ufs.strategy.maxSurge}
### Максимальное количество подов, которые могут быть недоступны во время обновления (можно в процентах, можно явное количество)
router-executor-router-executor.ose.deployment.spec.strategy.rollingParams.maxUnavailable=${global.ufs.strategy.maxUnavailable}
### Время ожидания поднятия подов, прежде чем сдаться и откатится к предыдущему успешному деплойменту
router-executor-router-executor.ose.deployment.spec.strategy.rollingParams.timeoutSeconds=${global.ufs.strategy.timeoutSeconds}
### Время ожидания между отдельными обновлениями пода
router-executor-router-executor.ose.deployment.spec.strategy.rollingParams.updatePeriodSeconds=${global.ufs.strategy.updatePeriodSeconds}

# Параметры для openshift/<config-fp-name>/ratelimit-ef.yaml
router-executor-router-executor.ose.envoy_filter.local_rate_limit.value.token_bucket.workfow-start.fill_interval=1s
router-executor-router-executor.ose.envoy_filter.local_rate_limit.value.token_bucket.workfow-start.max_tokens=8
router-executor-router-executor.ose.envoy_filter.local_rate_limit.value.token_bucket.workfow-start.tokens_per_fill=8
router-executor-router-executor.ose.envoy_filter.local_rate_limit.value.token_bucket.workfow-continue.fill_interval=1s
router-executor-router-executor.ose.envoy_filter.local_rate_limit.value.token_bucket.workfow-continue.max_tokens=8
router-executor-router-executor.ose.envoy_filter.local_rate_limit.value.token_bucket.workfow-continue.tokens_per_fill=8
router-executor-router-executor.ose.envoy_filter.local_rate_limit.value.token_bucket.other.fill_interval=1s
router-executor-router-executor.ose.envoy_filter.local_rate_limit.value.token_bucket.other.max_tokens=8
router-executor-router-executor.ose.envoy_filter.local_rate_limit.value.token_bucket.other.tokens_per_fill=8
router-executor-router-executor.ose.envoy_filter.local_rate_limit.value.token_bucket.overall.fill_interval=1s
router-executor-router-executor.ose.envoy_filter.local_rate_limit.value.token_bucket.overall.max_tokens=500
router-executor-router-executor.ose.envoy_filter.local_rate_limit.value.token_bucket.overall.tokens_per_fill=500

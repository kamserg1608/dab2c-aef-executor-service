# Журналирование
ufs-logger.kafka.bootstrap.servers=${global.platform.logger.kafka.bootstrap.servers}
ufs-logger.kafka.compression.type=${global.platform.logging.kafka.compression}
ufs-logger.kafka.max.request.size=${global.platform.logger.kafka.max.request.size}
ufs-logger.kafka.security.protocol=${global.platform.logger.kafka.security.protocol}
ufs-logger.kafka.ssl.enabled.protocols=${global.platform.kafka.ssl.enabled.protocols}
ufs-logger.kafka.topic=${global.platform.logger.kafka.topic}
ufs-logger.parameters.url=${global.ose.platform.ufs.baseurl.logger}/ufs-logger-parameters-ng/parameters


# Мониторинг

## Режим PUSH
ufs-monitoring.metrics.micrometer.publish.idle=false
ufs-monitoring.micrometer.push.gateway.enabled=true
ufs-monitoring.micrometer.push.gateway.url=${global.monitoring.micrometer.url}
ufs-monitoring.micrometer.push.gateway.job=${global.monitoring.micrometer.job}

## Режим ENDPOINT
ufs-monitoring.micrometer.endpoint.enabled=false
ufs-monitoring.micrometer.endpoint.ssl.enabled=false

## Фильтрация метрик
ufs-monitoring.micrometer.filters.enabled=true
ufs-monitoring.micrometer.filters.connectUrl=${global.monitoring.micrometer.filters.url}

## Настройки для КМ
ufs-monitoring.settings.enabled=true
ufs-monitoring.settings.connectUrl=${global.monitoring.settings.url}


# Аудит
## Параметры для application-PROM.yaml
{% for item in kafka_union_audit_list %}
{% for group in balance_group_union_audit_list %}
{% if item.name in group.providers %}

union-audit.kafka.$$$item.name$$$.bootstrap.servers=!$$$item.bootstrap$$$
union-audit.kafka.$$$item.name$$$.batch.size=${global.platform.kafka.producer.batch.size}
union-audit.kafka.$$$item.name$$$.buffer.memory=${global.platform.kafka.producer.buffer.memory}
union-audit.kafka.$$$item.name$$$.compression.type=${global.platform.kafka.producer.compression.type}
union-audit.kafka.$$$item.name$$$.connections.max.idle.ms=${global.platform.kafka.producer.connections.max.idle.ms}
union-audit.kafka.$$$item.name$$$.delivery.timeout.ms=${global.platform.union_audit.kafka.producer.delivery.timeout.ms}
union-audit.kafka.$$$item.name$$$.linger.ms=${global.platform.kafka.producer.linger.ms}
union-audit.kafka.$$$item.name$$$.max.block.ms=${global.platform.union_audit.kafka.producer.max.block.ms}
union-audit.kafka.$$$item.name$$$.max.request.size=${global.platform.union_audit.kafka.producer.max.request.size}
union-audit.kafka.$$$item.name$$$.metadata.max.age.ms=${global.platform.kafka.producer.metadata.max.age.ms}
union-audit.kafka.$$$item.name$$$.receive.buffer.bytes=${global.platform.kafka.producer.receive.buffer.bytes}
union-audit.kafka.$$$item.name$$$.request.timeout.ms=${global.platform.union_audit.kafka.producer.request.timeout.ms}
union-audit.kafka.$$$item.name$$$.send.buffer.bytes=${global.platform.kafka.producer.send.buffer.bytes}
union-audit.kafka.$$$item.name$$$.security.protocol=${global.platform.kafka.security.protocol}
union-audit.kafka.$$$item.name$$$.ssl.endpoint.identification.algorithm=${global.platform.kafka.ssl.endpoint.identification.algorithm}
union-audit.kafka.$$$item.name$$$.ssl.enabled.protocols=${global.platform.kafka.ssl.enabled.protocols}

# Топики для провайдера $$$item.name$$$
{% if "UFS" in group.protocol %}
union-audit.kafka.$$$item.name$$$.topic.audit-events-crit-in=audit-events-crit-in
union-audit.kafka.$$$item.name$$$.topic.audit-events-uncrit-in=audit-events-uncrit-in
union-audit.kafka.$$$item.name$$$.topic.audit-metamodel-in=audit-metamodel-in
{% elif "UNION" in group.protocol %}
union-audit.kafka.$$$item.name$$$.topic.audit-events-crit-in=<example_event_topic_from_issue>
union-audit.kafka.$$$item.name$$$.topic.audit-events-uncrit-in=<example_event_topic_from_issue>
union-audit.kafka.$$$item.name$$$.topic.audit-metamodel-in=<example_metamodel_topic_from_issue>
{% endif %}

### Конец проверки item.name in group.providers #
{% endif %}
### Конец цикла по balance_group_union_audit_list
{% endfor %}
### Конец цикла по kafka_union_audit_list
{% endfor %}

{% for group in balance_group_union_audit_list %}
union-audit.balance_group.$$$group.name$$$.main=$$$group.main$$$
union-audit.balance_group.$$$group.name$$$.providerClass=$$$group.provider_class$$$
union-audit.balance_group.$$$group.name$$$.priority=$$$loop.revindex * 11$$$
union-audit.balance_group.$$$group.name$$$.eventProtocol=$$$group.protocol$$$
union-audit.balance_group.$$$group.name$$$.balanceMode=RR
union-audit.balance_group.$$$group.name$$$.circuit_breaker.recoveryTimeout=${global.platform.union_audit.circuit_breaker.recoveryTimeout}
union-audit.balance_group.$$$group.name$$$.circuit_breaker.successThreshold=${global.platform.union_audit.circuit_breaker.successThreshold}
union-audit.balance_group.$$$group.name$$$.circuit_breaker.mode=ERROR_WINDOW
# Только для ERROR_WINDOW
union-audit.balance_group.$$$group.name$$$.circuit_breaker.failureThreshold=${global.platform.union_audit.circuit_breaker.failureThreshold}

union-audit.balance_group.$$$group.name$$$.providers=$$$group.providers | join(',')$$$

{% if "UFS" in group.protocol %}
union-audit.balance_group.$$$group.name$$$.maxMsgSizeBytes=104857600
{% else %}
union-audit.balance_group.$$$group.name$$$.maxMsgSizeBytes=2621440
{% endif %}

### Конец цикла по balance_group_union_audit_list
{% endfor %}


apiVersion: v1
kind: KeyValueSecret
spec:
  path: "${global.hashicorp.opsPath}"
  engineVersion: "${global.hashicorp.engine.kv.version}"
  key: cbul.dab2c
  parameters:
    - property: cbul.dab2c.token
      generator: cbul
    - property: cbul.dab2c.cn
      value: "{{ fpConfig.groupId }}-{{ fpConfig.artifactId }}-CLIENT"

apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: egressgateway-mtls-router-executor-monm-unver
spec:
  exportTo:
    - .
  host: ${global.monitoring.store.host}
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    portLevelSettings:
      - port:
          number: ${global.monitoring.store.port}
        tls:
          caCertificates: /etc/istio/egressgateway-ca-certs/root.crt
          clientCertificate: /etc/istio/egressgateway-certs/tls.crt
          mode: MUTUAL
          privateKey: /etc/istio/egressgateway-certs/tls.key
          sni: ${global.monitoring.store.host}
  workloadSelector:
    matchLabels:
      app: istio-egressgateway-router-executor-unver
      istio: egressgateway-router-executor-unver
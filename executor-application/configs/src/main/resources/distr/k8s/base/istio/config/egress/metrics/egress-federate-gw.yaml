apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: egressgateway-federate-router-executor-unver
spec:
  selector:
    istio: egressgateway-router-executor-unver
  servers:
    - hosts:
        - 'metrics.{{ lookup("custom_vars", "global.multiClusters.openshiftCluster") | regex_replace("^https?://", "") | regex_replace("^api\\.", "") | regex_replace(":[^/:]*", "") | regex_replace("/[^/]*$", "") }}'
      port:
        name: http-2001
        number: 2001
        protocol: HTTP

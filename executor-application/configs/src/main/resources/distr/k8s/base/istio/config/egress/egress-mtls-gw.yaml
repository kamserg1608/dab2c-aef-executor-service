apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: egressgateway-mtls-router-executor-unver
spec:
  selector:
    istio: egressgateway-router-executor-unver
  servers:
    - hosts:
        - '*'
      port:
        name: http
        number: ${router-executor.ctr.istio.egress.common.internal-port}
        protocol: HTTP
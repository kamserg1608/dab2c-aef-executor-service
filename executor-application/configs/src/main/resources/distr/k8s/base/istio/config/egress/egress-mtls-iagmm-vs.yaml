apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: egressgateway-mtls-router-executor-iagmm-unver
spec:
  exportTo:
    - .
  gateways:
    - egressgateway-mtls-router-executor-unver
    - mesh
  hosts:
    - ${router-executor.ctr.istio.egress.se.http.iag-mm.host}
  http:
    - match:
        - gateways:
            - mesh
          port: ${router-executor.ctr.istio.egress.common.internal-port}
      route:
        - destination:
            host: egressgateway-router-executor-unver
            port:
              number: ${router-executor.ctr.istio.egress.common.internal-port}
          weight: 100
      retries:
        attempts: 0
    - match:
        - gateways:
            - egressgateway-mtls-router-executor-unver
          port: ${router-executor.ctr.istio.egress.common.internal-port}
      route:
        - destination:
            host: ${router-executor.ctr.istio.egress.se.http.iag-mm.host}
            port:
              number: ${router-executor.ctr.istio.egress.se.http.iag-mm.port}
          weight: 100
      retries:
        attempts: 0
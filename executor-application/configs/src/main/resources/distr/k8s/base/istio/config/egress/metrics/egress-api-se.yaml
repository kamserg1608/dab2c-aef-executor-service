kind: ServiceEntry
apiVersion: networking.istio.io/v1alpha3
metadata:
  name: egressgateway-api-router-executor-unver
spec:
  exportTo:
    - .
  hosts:
    - '{{ lookup("custom_vars", "global.multiClusters.openshiftCluster") | regex_replace("^https?://", "") | regex_replace(":[^/:]*", "") | regex_replace("/[^/]*$", "") }}'
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - name: https-6443
      number: 6443
      protocol: https
    - name: http-80
      number: 80
      protocol: http

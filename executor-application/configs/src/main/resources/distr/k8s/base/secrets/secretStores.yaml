{%- macro extract_host(p) -%}
  {{ p | regex_replace('^https?:\/\/api\.([\w\-.]+)(:\d+)?(\/.+)?$', '\\1') }}
{%- endmacro -%}
# SecretStore для K/V
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: secret-store-block-kv
spec:
  provider:
    vault:
      namespace: {{ lookup('custom_vars', 'global.hashicorp.opsPath').split('/')[1] }}
      server: ${global.hashicorp.hashiCorpUrl}
      path: ${global.hashicorp.opsPath}
      version: ${global.hashicorp.engine.kv.version}
      auth:
        kubernetes:
          mountPath: k8s/{{ extract_host(vars['global.multiClusters.openshiftCluster']) }}
          role: "auth-role-efsfl"
          serviceAccountRef:
            name: "default"

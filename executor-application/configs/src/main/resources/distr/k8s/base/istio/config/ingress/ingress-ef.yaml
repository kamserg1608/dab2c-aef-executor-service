apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ingressgateway-@fpi-name@-unver
spec:
  workloadSelector:
    labels:
      app: istio-ingressgateway-@fpi-name@-unver
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
          portNumber: 11443
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.rbac
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
            rules:
              action: ALLOW
              policies:
                client-cert-policy:
                  permissions:
                    - or_rules:
                        rules:
                          - header:
                              name: ':path'
                              prefix_match: /@server.context.path1@/
                          - header:
                              name: ':path'
                              prefix_match: /@server.context.path2@/
                          - header:
                              name: ':path'
                              prefix_match: /@server.context.path3@/
                          - header:
                              name: ':path'
                              prefix_match: /healthcheck/service-healthcheck/
                  principals:
                    - or_ids:
                        ids:
                          - header:
                              name: x-forwarded-client-cert
                              safe_regex_match:
                                google_re2:
                                  max_program_size: 200
                                regex: ${@fpi-name@.ose.istio.ingress.envoy_filter.regex_match.client.cn}

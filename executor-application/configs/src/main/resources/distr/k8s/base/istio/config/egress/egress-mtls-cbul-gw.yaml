apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: egressgateway-mtls-cbul-router-executor-unver
spec:
  selector:
    istio: egressgateway-router-executor-unver
  servers:
    - hosts:
        - '${global.platform.ufs.cbul.hosts.mask}'
      port:
        name: http-dynamic
        number: 8280
        protocol: HTTP

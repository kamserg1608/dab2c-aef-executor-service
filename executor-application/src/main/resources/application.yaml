spring:
  webflux:
    base-path: /@server.context.path@
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:PROM}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

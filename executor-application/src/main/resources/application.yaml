spring:
  webflux:
    base-path: /
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:PROM}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
  prometheus:
    metrics:
      export:
        enabled: true

server:
  servlet:
    context-path: /@server.context.path@

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:PROM}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

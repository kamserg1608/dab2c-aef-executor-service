openapi: 3.0.1
info:
  title: DA-UFS Sidecar Service API
  description: API документация для всех зарегистрированных контроллеров в DA-UFS Sidecar сервисе
  version: "1.0"
servers:
  - url: http://localhost:8080
paths:
  /audit/event:
    post:
      summary: Отправка события аудита
      description: Обрабатывает POST-запрос для публикации события аудита
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditEventServiceEvent'
        required: true
      responses:
        '200':
          description: Успешная обработка события
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseVoid'
  /clob-data/get:
    post:
      summary: Получение CLOB данных
      description: Получает CLOB данные по идентификатору клиента и алиасу
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestClobData'
        required: true
      responses:
        '200':
          description: Успешное получение данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseListString'
  /clob-data/createOrUpdate:
    post:
      summary: Создание или обновление CLOB данных
      description: Создает или обновляет CLOB запись
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateClobData'
        required: true
      responses:
        '200':
          description: Успешное создание/обновление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseClobRecordInfo'
  /clob-data/delete:
    post:
      summary: Удаление CLOB данных
      description: Удаляет CLOB запись по идентификатору клиента, алиасу и уникальному идентификатору
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteClobData'
        required: true
      responses:
        '200':
          description: Успешное удаление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseString'
  /cms/get-content:
    post:
      summary: Получение контента из CMS
      description: Получает контент из системы управления контентом
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SberCmsContentBrokerApiRequest'
        required: true
      responses:
        '200':
          description: Успешное получение контента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseSberCmsContentBrokerApiResponse'
  /getPersonInfoByRegionKind:
    post:
      summary: Получение информации о клиенте по регионам
      description: Проксирование запроса со списком регионов в КМ Профиля ФЛ и возврат заполненного профиля клиента
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Успешное получение профиля клиента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseProfile'
  /retrieveParams:
    post:
      summary: Получение параметров
      description: Получает значения параметров по их именам
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: Успешное получение параметров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseParameters'
  /session/readData:
    post:
      summary: Чтение данных сессии
      description: Читает данные сессии из SDS
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SdsSectionInfo'
        required: true
      responses:
        '200':
          description: Успешное чтение данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseListSdsSectionData'
  /session/writeData:
    post:
      summary: Запись данных сессии
      description: Записывает данные сессии в SDS
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SdsSectionData'
        required: true
      responses:
        '200':
          description: Успешная запись данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseVoid'
  /tech_breaks/check_availability:
    post:
      summary: Проверка доступности систем
      description: Проверяет доступность систем по их идентификаторам
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: Результат проверки доступности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseListSystemState'
  /checkPermissions:
    post:
      summary: Проверка прав доступа
      description: Проверяет права доступа по JSON с привилегиями
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Результат проверки прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponsePrivileges'
  /fraudmon/analyze:
    post:
      summary: Проверка данных во Фродмониторинг
      description: Передает данные для Фродмониторинг
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FraudmonData'
        required: true
      responses:
        "200":
          description: Результат анализа операции на предмет мошенничества
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseFraudRsMessage'
  /configurator/success-match:
    post:
      summary: Получение флага успешно рассчитанной конфигурации
      description: Получает флаг успешно рассчитанной конфигурации из ССД
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppSourceRequest'
        required: true
      responses:
        "200":
          description: Возвращает флаг успешно рассчитанной конфигурации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseBoolean'
  /configurator/session:
    post:
      summary: Получение конфигурации сессии
      description: Получает рассчитанную конфигурацию сессии из ССД
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppSourceRequest'
        required: true
      responses:
        "200":
          description: Возвратает конфигурацию сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseSessionConfig'
  /configurator/rest-agent:
    post:
      summary: Получение конфигурации рестовых агентов
      description: Получает рассчитанную конфигурацию рестовых агентов из ССД
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppSourceRequest'
        required: true
      responses:
        "200":
          description: Возвращает конфигурацию рестовых агентов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseMapStringAgentConfig'
  /configurator/agent:
    post:
      summary: Получение конфигурации агентов
      description: Получает рассчитанную конфигурацию агента из ССД
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigRequest'
        required: true
      responses:
        "200":
          description: Возвращает конфигурацию агента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseAgentConfig'
  /configurator/function:
    post:
      summary: Получение конфигурации функций
      description: Получает конфигурации функций агента из Конфигуратора
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionConfigRequest'
        required: true
      responses:
        "200":
          description: Возвращает конфигурации функций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseMapStringFunctionConfig'
              example:
                success: true
                body:
                  function_1:
                    type: IAG
                    path: /example-1
                    modality:
                      - voice
                  function_2:
                    type: DIVR
                    modality:
                      - text
                  function_n:
                    type: BACKEND
                    modality:
                      - text
                      - voice
components:
  schemas:
    Alert:
      type: object
      properties:
        title:
          type: string
        text:
          type: string
        type:
          type: string
          enum:
            - ERROR
            - WARNING
            - INFO
            - VALIDATION
            - FRAUD
            - DIALOG
            - CUSTOM
        data:
          type: object
          additionalProperties:
            type: string
    BaseResponseVoid:
      type: object
      properties:
        success:
          type: boolean
    AuditEventServiceEvent:
      type: object
      properties:
        success:
          type: boolean
        event:
          type: string
        params:
          type: object
          additionalProperties:
            type: string
    BaseResponseListString:
      type: object
      properties:
        result:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    BaseResponseClobRecordInfo:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/ClobRecordInfo'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    BaseResponseString:
      type: object
      properties:
        result:
          type: string
          nullable: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    BaseResponseSberCmsContentBrokerApiResponse:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/SberCmsContentBrokerApiResponse'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    BaseResponseProfile:
      type: object
      properties:
        success:
          type: boolean
        body:
          $ref: '#/components/schemas/Profile'
        context:
          $ref: '#/components/schemas/Context'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        error:
          $ref: '#/components/schemas/Error'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
    BaseResponseParameters:
      type: object
      properties:
        success:
          type: boolean
        body:
          $ref: '#/components/schemas/Parameters'
    BaseResponseListSdsSectionData:
      type: object
      properties:
        success:
          type: boolean
        body:
          type: array
          items:
            $ref: '#/components/schemas/SdsSectionData'
    BaseResponseListSystemState:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/SystemState'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    BaseResponsePrivileges:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/Privileges'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        description:
          type: string
        category:
          type: string
        stacktrace:
          type: string
    ProductsExt:
      type: object
      properties:
        cards:
          $ref: '#/components/schemas/CardsExt'
        accounts:
          $ref: '#/components/schemas/AccountsExt'
        loans:
          $ref: '#/components/schemas/LoansAcctExt'
        targets:
          $ref: '#/components/schemas/AccountTargetsExt'
        imAccounts:
          $ref: '#/components/schemas/ImAccountsExt'
        depoAccounts:
          $ref: '#/components/schemas/DepoAccountsExt'
        servicePackages:
          $ref: '#/components/schemas/ServicePackagesExt'
        packageOptions:
          $ref: '#/components/schemas/PackageOptionsExt'
        brokerageAgreements:
          $ref: '#/components/schemas/BrokerageAgreementsExt'
        transactionAccounts:
          $ref: '#/components/schemas/TransactionAccounts'
        securityAccounts:
          $ref: '#/components/schemas/SecurityAccountsExt'
        kidsCards:
          $ref: '#/components/schemas/CardsExt'
      description: Продукты клиента.
    Profile:
      type: object
      properties:
        person:
          $ref: '#/components/schemas/PersonType'
        products:
          $ref: '#/components/schemas/ProductsExt'
        ukoSettings:
          $ref: '#/components/schemas/UkoSettings'
        regionInfo:
          type: object
          description: Не используется. Данные по региону и валидности информации
            в нём.
          deprecated: true
        employeeInfo:
          $ref: '#/components/schemas/EmployeeInfo'
    UkoSettings:
      type: object
      properties:
        sbolNotificationSettings:
          $ref: '#/components/schemas/SbolNotificationSettings'
        usPerson:
          $ref: '#/components/schemas/UsPerson'
        usCardList:
          $ref: '#/components/schemas/UsCardList'
        usAccountList:
          $ref: '#/components/schemas/UsAccountList'
        usImAccountList:
          $ref: '#/components/schemas/UsImAccountList'
        usInsuranceList:
          $ref: '#/components/schemas/UsInsuranceList'
        usLoanList:
          $ref: '#/components/schemas/UsLoanList'
        usDepoAccountList:
          $ref: '#/components/schemas/UsDepoAccountList'
        usTransactionAccountList:
          $ref: '#/components/schemas/UsTransactionAccountList'
        usSecurityAccountList:
          $ref: '#/components/schemas/UsSecurityAccountList'
      description: Пользовательские настройки клиента.
    UsAccountList:
      type: object
      description: Настройки счетов в СБОЛ.
    UsCardList:
      type: object
      description: Настройки карт в СБОЛ.
    UsDepoAccountList:
      type: object
      description: Настройки по счетам ДЕПО
    UsImAccountList:
      type: object
      description: Настройки по металлическим счетам.
    UsInsuranceList:
      type: object
      description: Настройки по страховкам.
    UsLoanList:
      type: object
      description: Настройки по кредитам.
    UsPaymentRegion:
      type: object
      properties:
        id:
          type: integer
          description: ID в БД ЕРИБ.
          format: int64
        name:
          type: string
          description: Наименование региона.
        code:
          type: string
          description: код региона в справочнике ЦАС НСИ.
      description: "Географический регион поставщиков услуг, который клиент выбрал\
          \ в профиле СБОЛ (null - если регион не выбран)."
    UsPerson:
      type: object
      properties:
        sbolNotificationSettings:
          $ref: '#/components/schemas/SbolNotificationSettings'
        loginId:
          type: integer
          description: Логин ID клиента в ЦСА (цифровой логин в СБОЛ).
          format: int64
        blockId:
          type: integer
          description: "Номер блока ЕРИБ, в котором обслуживается клиент."
          format: int64
        email:
          type: string
          description: "Адрес электронной почты, указанный для получения оповещени\
              й СБОЛ."
        paymentRegion:
          $ref: '#/components/schemas/UsPaymentRegion'
        mobileBankProfile:
          $ref: '#/components/schemas/MobileBankProfile'
        userAddedDocumentList:
          $ref: '#/components/schemas/UserAddedDocumentList'
      description: Настройки персонального профиля в СБОЛ.
    UsSecurityAccountList:
      type: object
      description: Настройки по СберСертификатам
    UsTransactionAccountList:
      type: object
      description: Настройки по транзакционными счетам
    PersonDepartment:
      type: object
      properties:
        tb:
          type: string
          description: ТБ.
        osb:
          type: string
          description: ОСБ.
        vsp:
          type: string
          description: ВСП.
        name:
          type: string
          description: Наименование.
      description: personDepartment.
    PersonType:
      type: object
      properties:
        loginId:
          type: integer
          description: Логин ID клиента в ЦСА (цифровой логин в СБОЛ).
          format: int64
        mdmId:
          type: integer
          description: Идентификатор клиента в MDM.
          format: int64
        surName:
          type: string
          description: Фамилия с маской.
        firstName:
          type: string
          description: Имя.
        patrName:
          type: string
          description: Отчество.
        surNameNotMasked:
          type: string
          description: Фамилия без маски.
        linkFio:
          type: string
          description: Ссылка для редиректа в ЕРИБ при нажатии на ФИО.
        lastIpAddress:
          type: string
          description: IP адрес последнего входа.
        creationType:
          type: string
          description: "Тип договора, по которому подключен клиент"
        department:
          $ref: '#/components/schemas/Department'
        personDepartment:
          $ref: '#/components/schemas/PersonDepartment'
        lastLogonDate:
          type: string
          description: "Дата последнего входа [yyyy-MM-dd'T'HH:mm:ss.SSSZ]"
          format: date-time
        blockId:
          type: integer
          description: "Номер блока ЕРИБ, в котором обслуживается клиент."
          format: int64
        birthDay:
          type: string
          description: "Дата рождения [yyyy-MM-dd'T'HH:mm:ss.SSSZ]"
          format: date-time
        confirmType:
          type: string
          description: Способ подтверждения входа клиента
        ernpInfo:
          type: string
          description: "ERNPInfo код, на основе которого будет считаться курс валю\
                т клиента"
        gender:
          type: string
          description: Пол.
        email:
          type: string
          description: Адрес электронной почты.
        citizenShip:
          type: string
          description: Гражданство.
        birthPlace:
          type: string
          description: Место рождения.
        mobileBankProfile:
          $ref: '#/components/schemas/MobileBankProfile'
        phoneList:
          $ref: '#/components/schemas/PhoneList'
        documentList:
          $ref: '#/components/schemas/DocumentList'
        addressList:
          $ref: '#/components/schemas/AddressList'
        serviceInfo:
          $ref: '#/components/schemas/ServiceInfo'
        additionalInfo:
          $ref: '#/components/schemas/AdditionalInfo'
        regionExt:
          $ref: '#/components/schemas/PersonRegionExt'
        optionList:
          $ref: '#/components/schemas/OptionList'
        segmentCode:
          type: string
          description: Код сегмента обслуживания клиента
        snils:
          type: string
          description: Снилс.
        fatca:
          $ref: '#/components/schemas/SbrfPersonFatca'
        papers:
          $ref: '#/components/schemas/NonIdentificationPapersVa'
        ucpId:
          type: string
          description: Идентификатор единого профиля клиента(ЕПК id).
        isSelfEmployed:
          type: boolean
          description: Признак самозанятого
        isPrivateBanking:
          type: boolean
          description: Признак принадлежности клиента к сегменту Private Banking.
        customerKnowledge:
          $ref: '#/components/schemas/CustomerKnowledge'
        segmentB2c:
          $ref: '#/components/schemas/SegmentB2c'
      description: Персональные данные клиента
    Department:
      type: object
      properties:
        id:
          type: integer
          description: id.
          format: int64
        name:
          type: string
          description: name.
      description: Идентификатор ВСП обслуживания клиента.
    MobileBankProfile:
      type: object
      properties:
        registeredPhonesListFull:
          $ref: '#/components/schemas/RegisteredPhones'
        mbSystem:
          type: string
          description: "Система МБ, в которой зарегистрирован клиент"
      description: Данные о клиенте в мобильном банке МБК.
    PhoneList:
      type: object
      description: Телефоны клиента.
    DocumentList:
      type: object
      description: Список ДУЛов клиента.
    AddressList:
      type: object
      description: "Адреса клиента (регистрации, проживания…)."
    ServiceInfo:
      type: object
      properties:
        agreementNumber:
          type: string
          description: Номер договора.
        agreementDate:
          type: string
          description: Дата оформления договора
          format: date-time
        serviceInsertionDate:
          type: string
          description: Дата начала обслуживания
          format: date-time
        prolongationRejectionDate:
          type: string
          description: Дата расторжения договора
          format: date-time
        contractCancellationCouse:
          type: string
          description: Причина расторжения договора.
        lastUpdateDate:
          type: string
          description: Дата и время последнего изменения данных
          format: date-time
        employeeId:
          type: string
          description: "идентификатор сотрудника, который отправил заявку на удале\
                ние клиента."
        managerId:
          type: string
          description: "Номер менеджера, за которым закреплён клиент."
        managerDepartmentInfo:
          $ref: '#/components/schemas/ManagerDepartmentInfo'
      description: Данные о договоре клиента с Банком.
    AdditionalInfo:
      type: object
      properties:
        mobileOperator:
          type: string
          description: Мобильный оператор.
        isResident:
          type: boolean
          description: Является ли резидентом.
        displayClientId:
          type: string
          description: displayClientId.
        isRegisteredInDepo:
          type: boolean
          description: Признак регистрации в депозитарии.
        mdmState:
          type: string
          description: Информация об отправке данных в МДМ
        segmentCodeType:
          type: string
          description: "Код сегмента, к которому относят клиента."
        tariff:
          $ref: '#/components/schemas/TariffInfo'
        securityType:
          type: string
          description: Уровень безопасности
      description: Остальные данные клиента.
    PersonRegionExt:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор региона в справочнике Регионов.
          format: int64
        name:
          type: string
          description: Наименование региона.
        code:
          type: string
          description: Код региона.
      description: "Регион, который клиент выбрал в профиле СБОЛ (null - если реги\
            он не выбран)."
    SbrfPersonFatca:
      type: object

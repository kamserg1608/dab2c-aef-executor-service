kind: ServiceEntry
apiVersion: networking.istio.io/v1alpha3
metadata:
  name: egressgateway-federate-@fpi-name@-unver
spec:
  exportTo:
    - .
  hosts:
    - 'metrics.{{ lookup("custom_vars", "global.multiClusters.openshiftCluster") | regex_replace("^https?://", "") | regex_replace("^api\\.", "") | regex_replace(":[^/:]*", "") | regex_replace("/[^/]*$", "") }}'
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - name: https-8481
      number: 8481
      protocol: https
    - name: http-80
      number: 80
      protocol: http

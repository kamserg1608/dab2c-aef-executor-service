apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: egressgateway-dashes-@fpi-name@-unver
spec:
  exportTo:
    - .
  host: '${@fpi-name@.ctr.istio.egress.se.http.dashes.host}'
  trafficPolicy:
    portLevelSettings:
      - port:
          number: ${@fpi-name@.ctr.istio.egress.se.http.dashes.port}
        tls:
          caCertificates: /vault/secrets/ca-chain.pem
          clientCertificate: /vault/secrets/client-cert.pem
          privateKey: /vault/secrets/client-cert.key
          mode: MUTUAL
          sni: ${@fpi-name@.ctr.istio.egress.se.http.dashes.host}
  workloadSelector:
    matchLabels:
      app: istio-egressgateway-@fpi-name@-unver

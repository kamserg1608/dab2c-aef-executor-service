apiVersion: v1
kind: Service
metadata:
  name: egressgateway-api-@fpi-name@-unver
  labels:
    app: egressgateway-@fpi-name@-unver
  namespace: ${global.multiClusters.openshiftProjectName}
spec:
  ports:
    - name: http-2002
      protocol: TCP
      port: 2002
      targetPort: 2002
  selector:
    app: istio-egressgateway-@fpi-name@-unver
